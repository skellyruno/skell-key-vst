name: Build Skell Key Windows VST3
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure CMake (JUCE fetched automatically)
        run: cmake -S . -B build -A x64 -DSKELL_KEY_BUILD_SYNC_TESTS=ON

      - name: Build Release VST3
        run: cmake --build build --config Release --parallel 2

      - name: Run tuning sync tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package VST3
        shell: pwsh
        run: |
          $plugins = @(Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' |
              Where-Object { $_.Name -eq 'Skell Key.vst3' })
          if ($plugins.Count -ne 1) { throw "Expected one Skell Key VST3, found $($plugins.Count)" }
          Compress-Archive -LiteralPath $plugins[0].FullName -DestinationPath Skell-Key-Windows-VST3.zip -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v6
        with:
          name: Skell-Key-Windows-VST3
          path: Skell-Key-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 7
