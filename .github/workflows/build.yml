name: Build Skell Key Windows VST3
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure CMake (JUCE fetched automatically)
        run: cmake -S . -B build -A x64 -DSKELL_KEY_BUILD_SYNC_TESTS=ON

      - name: Build Release VST3
        run: cmake --build build --config Release --parallel 2

      - name: Run tuning sync tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'No VST3 bundle was produced' }
          Compress-Archive -Path $plugin.FullName -DestinationPath Skell-Key-Windows-VST3.zip

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skell-Key-Windows-VST3
          path: Skell-Key-Windows-VST3.zip
          if-no-files-found: error
